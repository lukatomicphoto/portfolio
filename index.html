<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - 6 Kolona</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        html.is-open, body.is-open {
            overflow: visible; 
            height: auto; 
        }

        .portfolio-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        html.is-open .portfolio-container {
            height: auto;
            min-height: 100vh;
        }

        .column {
            flex: 1;
            transition: flex 1.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-in-out;
            cursor: pointer;
            overflow: hidden; 
            display: flex;
            flex-direction: column; 
            min-height: 100vh;
            position: relative;
        }

        .column.active {
            flex: 100%;
            cursor: default;
            overflow: visible; 
        }

        .column.hidden {
            flex: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Osnova za fiksiranje slojeva */
        .sticky-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .bg-layer {
            z-index: 1;
            overflow: hidden; 
        }

        /* Obezbjeđuje da tekst uvjek bude iznad svih slojeva, čak i pri hoveru */
        .fg-layer {
            z-index: 10; 
        }

        .column.active .sticky-layer {
            position: sticky;
            height: 100vh;
        }

        /* Trik koji sprječava da prednji sloj završi ispod pozadine kada postanu sticky */
        .column.active .fg-layer {
            margin-top: -100vh; 
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center top; 
            z-index: 0;
            pointer-events: none;
            transform: scale(1.02);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .bg-image.parallax-active {
            transition: none !important;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            transition: background-color 0.6s ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            bottom: 0; left: 0; width: 50%; height: 100%; 
            background: linear-gradient(to right, rgba(0, 0, 0, 0.8), transparent);
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            z-index: 2;
            pointer-events: none;
        }

        .vignette-active {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.7) 35%, rgba(0, 0, 0, 0.2) 75%, transparent 100%);
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 3;
            pointer-events: none;
        }

        .column:not(.active):not(.hidden):hover {
            flex: 2;
        }
        .column:not(.active):not(.hidden):hover .bg-image {
            transform: scale(1.10); 
        }
        .column:not(.active):not(.hidden):hover .overlay {
            background-color: rgba(0, 0, 0, 0);
        }
        .column:not(.active):not(.hidden):hover .vignette {
            opacity: 1;
        }
        .column:not(.active):not(.hidden):hover .category-name {
            opacity: 1;
        }

        .column.active .bg-image {
            transform: scale(1.12) translateY(0); 
        }
        .column.active .overlay {
            background-color: rgba(0, 0, 0, 0); 
        }
        .column.active .vignette {
            opacity: 0; 
        }
        .column.active .vignette-active {
            opacity: 1; 
        }

        .category-name {
            position: absolute;
            top: 60%; 
            left: 40px; 
            color: white;
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            letter-spacing: 2px;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .column.active .category-name {
            opacity: 1;
        }

        .close-btn {
            position: fixed;
            top: 40px; 
            left: -100px; 
            z-index: 999;
            color: white;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
            opacity: 0;
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.5);
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
        }
        .close-btn.visible {
            left: 40px; 
            opacity: 1;
        }

        .gallery {
            display: flex;
            opacity: 0;
            visibility: hidden;
            flex-wrap: wrap;
            gap: 8px;
            /* Simetrični padding: 120px i desno i lijevo */
            padding: 40px 120px 40px 120px; 
            background-color: transparent; 
            width: 100%;
            margin-top: -55vh; 
            position: relative;
            z-index: 5; 
        }

        .gallery.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
        }

        .gallery-item {
            flex-grow: 1; 
            height: 35vh; 
            position: relative;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }
        .gallery::after {
            content: '';
            flex-grow: 999;
        }
    </style>
</head>
<body>

    <div id="closeBtn" class="close-btn" onclick="closeGallery(event)">&#10094;</div>

    <div class="portfolio-container">
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="sport.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>

            <div class="sticky-layer fg-layer">
                <div class="category-name">SPORT</div>
            </div>
            
            <div class="gallery">
                <div class="gallery-item"><img src="1.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="2.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="3.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="4.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="5.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="6.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="3.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="1.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="5.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="4.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="5.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="6.jpg" loading="lazy"></div>
                <div class="gallery-item"><img src="3.jpg" loading="lazy"></div>
            </div>
        </div>
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="love.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>
            <div class="sticky-layer fg-layer">
                <div class="category-name">LOVE</div>
            </div>
            <div class="gallery"></div>
        </div>
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="event.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>
            <div class="sticky-layer fg-layer">
                <div class="category-name">EVENT</div>
            </div>
            <div class="gallery"></div>
        </div>
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="fashion.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>
            <div class="sticky-layer fg-layer">
                <div class="category-name">FASHION</div>
            </div>
            <div class="gallery"></div>
        </div>
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="exp.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>
            <div class="sticky-layer fg-layer">
                <div class="category-name">EXPERIMENTAL</div>
            </div>
            <div class="gallery"></div>
        </div>
        
        <div class="column" onclick="openGallery(this)">
            <div class="sticky-layer bg-layer">
                <img src="studio.webp" class="bg-image">
                <div class="overlay"></div>
                <div class="vignette"></div>
                <div class="vignette-active"></div>
            </div>
            <div class="sticky-layer fg-layer">
                <div class="category-name">STUDIO</div>
            </div>
            <div class="gallery"></div>
        </div>

    </div>

    <script>
        // Povećana brzina paralaksa na savršenih 0.06
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!document.documentElement.classList.contains('is-open')) return;
            
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const activeImg = document.querySelector('.column.active .bg-image');
                    if (activeImg) {
                        const scrollY = window.scrollY || document.documentElement.scrollTop;
                        activeImg.style.transform = `scale(1.12) translateY(${scrollY * -0.06}px)`;
                    }
                    ticking = false;
                });
                ticking = true;
            }
        });

        function openGallery(selectedColumn) {
            if (selectedColumn.classList.contains('active')) return;

            window.scrollTo(0, 0);

            document.querySelectorAll('.column').forEach(col => {
                if (col !== selectedColumn) {
                    col.classList.remove('active');
                    col.classList.add('hidden');
                }
            });

            selectedColumn.classList.remove('hidden');
            selectedColumn.classList.add('active');
            
            document.body.classList.add('is-open');
            document.documentElement.classList.add('is-open');
            
            document.getElementById('closeBtn').classList.add('visible');

            const activeImg = selectedColumn.querySelector('.bg-image');
            if(activeImg) activeImg.style.transform = 'scale(1.12) translateY(0)';

            setTimeout(() => {
                const gallery = selectedColumn.querySelector('.gallery');
                if (gallery) gallery.classList.add('show');
                
                if(activeImg) activeImg.classList.add('parallax-active');
            }, 600); 
        }

        function closeGallery(event) {
            event.stopPropagation();
            
            const activeCol = document.querySelector('.column.active');
            if (!activeCol) return;

            document.getElementById('closeBtn').classList.remove('visible');

            const gallery = activeCol.querySelector('.gallery');
            if (gallery) {
                // Galerija se glatko gasi pune 0.8 sekunde tokom skrolanja naviše
                gallery.style.transition = 'opacity 0.8s ease-in-out, visibility 0.8s';
                gallery.classList.remove('show');
            }

            // Stranica započinje svoj prirodni smooth skrol
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Sklapanje kolona starta tačno kad se skrol smiri
            setTimeout(() => {
                const activeImg = activeCol.querySelector('.bg-image');
                if (activeImg) {
                    activeImg.classList.remove('parallax-active');
                    activeImg.style.transform = ''; 
                }

                document.querySelectorAll('.column').forEach(col => {
                    col.classList.remove('active', 'hidden');
                });
                
                document.body.classList.remove('is-open');
                document.documentElement.classList.remove('is-open');
                
                // Reset stylinga galerije u pozadini
                setTimeout(() => {
                    if (gallery) gallery.style.transition = '';
                }, 800);

            }, 600); 
        }
    </script>

</body>
</html>
