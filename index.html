<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luka Tomić — Photographer</title>
<meta name="description" content="Luka Tomić — commercial photographer. Sport, love, event, fashion, experimental and studio work.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Cg fill='%23efeae2'%3E%3Crect x='5' y='6' width='3' height='20'/%3E%3Crect x='10' y='6' width='5' height='20'/%3E%3Crect x='17' y='6' width='2' height='20'/%3E%3Crect x='21' y='6' width='6' height='20'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas class="gl" id="gl" aria-hidden="true"></canvas>

<aside class="info" id="info" aria-label="About and contact"></aside>

<main class="stage" id="stage" aria-label="Portfolio categories"></main>

<div class="gallery" id="gallery" inert>
  <div class="gal-spacer"></div>
  <div class="gal-meta" id="galMeta"></div>
  <div class="grid" id="grid"></div>
  <button class="gal-next" id="galNext" type="button"></button>
</div>

<button class="mark" id="mark" type="button" aria-expanded="false" aria-controls="info">
  <img class="mark-logo" src="logo.svg" alt="Luka Tomić — about and contact" width="38" height="38" draggable="false"><span class="mark-hint" aria-hidden="true">Contact</span>
</button>
<button class="back" id="back" type="button" aria-label="Back to all categories"><i aria-hidden="true"></i></button>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photograph viewer">
  <div class="lb-bg"></div>
  <img class="lb-img" alt="" draggable="false">
  <img class="lb-img" alt="" draggable="false">
  <div class="lb-count" id="lbCount"></div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photograph"><i aria-hidden="true"></i></button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photograph"><i aria-hidden="true"></i></button>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close"></button>
</div>

<noscript><p style="color:#efeae2;padding:2rem;font-family:monospace">This portfolio needs JavaScript.</p></noscript>

<script src="data.js"></script>
<script src="js/gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
