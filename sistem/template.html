<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="author" content="{{NAME}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{NAME}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:image:alt" content="{{IMAGE_ALT}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{IMAGE}}">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sistem/css/style.css">
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<div class="loader" aria-hidden="true"><img src="logo.svg" alt="" width="46" height="46"><i></i></div>

<canvas class="gl" id="gl" aria-hidden="true"></canvas>

<aside class="info" id="info" aria-label="About and contact"></aside>

<main class="stage" id="stage" aria-label="Portfolio categories"></main>

<div class="gallery" id="gallery" inert>
  <div class="gal-spacer"></div>
  <div class="gal-meta" id="galMeta"></div>
  <div class="grid" id="grid"></div>
  <button class="gal-next" id="galNext" type="button"></button>
</div>

<h1 class="mark-wrap">
  <button class="mark" id="mark" type="button" aria-expanded="false" aria-controls="info">
    <img class="mark-logo" src="logo.svg" alt="{{H1}}" width="38" height="38" draggable="false"><span class="mark-hint" aria-hidden="true">Contact</span>
  </button>
</h1>
<button class="back" id="back" type="button" aria-label="Back to all categories"><i aria-hidden="true"></i></button>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photograph viewer">
  <div class="lb-bg"></div>
  <img class="lb-img" alt="" draggable="false">
  <img class="lb-img" alt="" draggable="false">
  <div class="lb-count" id="lbCount"></div>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photograph"><i aria-hidden="true"></i></button>
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photograph"><i aria-hidden="true"></i></button>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close"></button>
</div>

<noscript>
{{NOSCRIPT}}
</noscript>

<script src="data.js?v={{V}}"></script>
<script src="sistem/js/gl.js?v={{V}}"></script>
<script src="sistem/js/app.js?v={{V}}"></script>
</body>
</html>
