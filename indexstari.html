<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - 6 Kolona</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Vrhunske bezier krive za cinematic / buttery smooth animacije */
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-smooth: cubic-bezier(0.25, 1, 0.35, 1);
            --ease-slow-zoom: cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        html.is-open, body.is-open {
            overflow: visible; 
            height: auto; 
        }

        .portfolio-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        html.is-open .portfolio-container {
            height: auto;
            min-height: 100vh;
        }

        .column {
            flex: 1;
            /* Dosta sporije tranzicije za column zatvaranje - mekše i glađe */
            transition: flex 1.2s var(--ease-cinematic), opacity 0.8s var(--ease-smooth);
            cursor: pointer;
            overflow: hidden; 
            display: flex;
            flex-direction: column; 
            min-height: 100vh;
            position: relative;
            will-change: flex;
            contain: layout paint;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            min-width: 0; /* CRITICAL: dozvoljava suzavanje kolone uprkos fiksiranoj galeriji */
        }

        .column.active {
            flex: 100%;
            cursor: default;
            overflow: visible; 
            /* Jako sporo i Cinematic otvaranje (1.5s) */
            transition: flex 1.5s var(--ease-cinematic);
        }

        .column.hidden {
            flex: 0;
            opacity: 0;
            pointer-events: none;
            /* Sporije skrivanje */
            transition: flex 1.2s var(--ease-cinematic), opacity 0.8s var(--ease-smooth);
        }

        /* Osnova za fiksiranje slojeva */
        .sticky-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100vh; /* FIX: Zauvek 100vh, sprecava flex-stretch razvlacenje slika */
            pointer-events: none;
        }

        .bg-layer {
            z-index: 1;
            overflow: hidden; 
        }

        /* Obezbjeđuje da tekst uvjek bude iznad svih slojeva, čak i pri hoveru */
        .fg-layer {
            z-index: 10; 
        }

        /* Tokom zatvaranja osiguravamo da slike ne naslede visinu skrolanog kontejnera */
        .column.active .sticky-layer,
        .column.is-closing-active .sticky-layer {
            position: sticky;
            height: 100vh;
        }

        /* Trik koji sprječava da prednji sloj završi ispod pozadine kada postanu sticky */
        .column.active .fg-layer,
        .column.is-closing-active .fg-layer {
            margin-top: -100vh; 
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Transform origin na center 30% osigurava da se slika prirodno blizi prema gore */
            transform-origin: center 30%; 
            z-index: 0;
            pointer-events: none;
            transform: translate3d(0, 0, 0) scale(1.02);
            transition: transform 1.2s var(--ease-slow-zoom), filter 1s var(--ease-smooth);
            will-change: transform, filter;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            transition: background-color 0.9s var(--ease-smooth);
            z-index: 1;
            pointer-events: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .vignette {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
            opacity: 0;
            /* Vinjeta izlazi odozdo */
            transform: translate3d(0, 40px, 0);
            transition: opacity 0.8s var(--ease-smooth), transform 1s var(--ease-cinematic);
            z-index: 2;
            pointer-events: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .vignette-active {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; 
            /* Zatamnjeno skroz gore za titl i dolje za sliku */
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.1) 20%, transparent 40%, transparent 80%, rgba(0, 0, 0, 0.9) 100%);
            opacity: 0;
            transition: opacity 1.5s var(--ease-smooth);
            z-index: 3;
            pointer-events: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .column:not(.active):not(.hidden):hover {
            flex: 2.2;
        }
        .column:not(.active):not(.hidden):hover .bg-image {
            transform: translate3d(0, 0, 0) scale(1.07); 
        }
        .column:not(.active):not(.hidden):hover .overlay {
            background-color: rgba(0, 0, 0, 0.1);
        }
        .column:not(.active):not(.hidden):hover .vignette {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }
        .column:not(.active):not(.hidden):hover .category-name {
            opacity: 1;
            /* Naslov na hover izlazi odozdo ka gore */
            transform: translate3d(-50%, 0, 0) scale(1);
            letter-spacing: 8px;
        }

        .column.active .bg-image {
            transform: translate3d(0, 0, 0) scale(1.10); 
            filter: blur(5px); /* Suptilan blur za čišći prikaz galerije */
        }
        .column.active .overlay {
            background-color: rgba(0, 0, 0, 0.6); /* 60% crni overlay za perfektnu citljivost */
        }
        
        /* Tokom vracanja nazad obezbedjujemo da bg-image ODMAH krene nazad u scale(1.02) uprkos zakucanoj sirini */
        .column.is-closing-active .bg-image {
            transform: translate3d(0, 0, 0) scale(1.02); 
            filter: blur(0px);
        }

        .column.active .vignette {
            opacity: 0; 
        }
        .column.active .vignette-active {
            opacity: 1; 
        }

        .category-name {
            position: absolute;
            top: auto; 
            bottom: 90px; 
            left: 50%; 
            color: white;
            font-size: 26px;
            font-weight: 500;
            text-transform: uppercase;
            white-space: nowrap;
            /* Uklonjen writing-mode kako bi bilo horizontalno */
            /* Translacija -50% drzi tekst po sredini */
            transform: translate3d(-50%, 50px, 0) scale(1);
            transform-origin: center bottom;
            letter-spacing: 2px;
            text-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.8s var(--ease-smooth), transform 1.2s var(--ease-cinematic), letter-spacing 1.2s var(--ease-cinematic);
            pointer-events: none;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: opacity, transform, letter-spacing;
        }
        .column.active .category-name {
            opacity: 1;
            /* Matematicki precizno poravnanje: dno teksta dolazi na tacno 60px od vrha ekrana */
            transform: translate3d(-50%, calc(-100vh + 215px), 0) scale(1.6);
            letter-spacing: 12px;
        }

        /* Prilikom zatvaranja naslov lagano ispliva ka gore i nestaje umesto da se vraca dole! */
        .column.is-closing-active .category-name {
            opacity: 0;
            transform: translate3d(-50%, calc(-100vh + 150px), 0) scale(1);
            letter-spacing: 12px;
            transition: opacity 0.02s ease-out, transform 0.03s ease-out;
        }

        .close-btn {
            position: fixed;
            top: 90px; /* Sredina dugmeta je na 35px, savrseno u ravni sa sredinom teksta */
            transform: translateY(-50%);
            left: -90px; 
            z-index: 999;
            color: white;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            background: transparent;
            border: none;
            padding: 0;
            opacity: 0;
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.5);
            transition: left 0.8s var(--ease-cinematic), opacity 0.8s ease;
        }
        .close-btn.visible {
            left: 50px; 
            opacity: 1;
        }

        .gallery {
            display: block;
            column-count: 3;
            column-gap: 8px;
            opacity: 0;
            visibility: hidden;
            /* Galerija prekriva zamalo cijeli ekran, startuje od 15vh (margin-top -85vh) */
            padding: 180px 120px 40px 120px; 
            background-color: transparent; 
            width: 100%;
            margin-top: -98vh; 
            position: relative;
            z-index: 5; 
            /* Galerija ce se pomjeriti gore prilikom paljenja (vise nego prije za bolji efekat) */
            transform: translate3d(0, 150px, 0);
            transition: opacity 1s var(--ease-smooth), transform 1s var(--ease-cinematic), visibility 1s;
        }

        .gallery.show {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0);
            transition: opacity 1.2s var(--ease-smooth), transform 1.5s var(--ease-cinematic), visibility 1.5s;
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 8px; 
            position: relative;
            break-inside: avoid; /* Sprečava pucanje slike na dve kolone */
        }
        
        .gallery-item img {
            width: 100%;
            height: auto; /* Zadržava originalne proporcije! Nema više cropovanja! */
            display: block;
            border-radius: 2px;
        }

        /* INFO WIDGET (Minimalisticki kontakt) */
        .info-widget {
            position: fixed;
            top: 195px;
            right: 50px;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .info-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 16px;
            transition: transform 0.6s var(--ease-cinematic), border-color 0.6s var(--ease-smooth), background-color 0.6s var(--ease-smooth);
            overflow: hidden; /* U slucaju da se ubaci logo slika */
        }
        
        .info-btn:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 1);
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Mesto za tvoj logo umesto 'i' ikonice */
        .info-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Promeni u block kad ubacis src u html-u */
        }

        .info-popup {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 24px 32px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-align: right;
            opacity: 0;
            visibility: hidden;
            /* Slajda odozgo (iz smera dugmeta) */
            transform: translate3d(0, -20px, 0);
            transition: opacity 0.6s var(--ease-smooth), transform 0.8s var(--ease-cinematic), visibility 0.8s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .info-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0);
        }

        .info-popup p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 12px; /* Veoma sitan i elegantan tekst */
            letter-spacing: 1.5px;
            line-height: 2.2;
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
        }
        .info-popup p:first-child {
            color: white;
            font-weight: 500;
            margin-bottom: 12px;
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>

    <script>
        function openGallery(selectedColumn) {
            if (selectedColumn.classList.contains('active')) return;

            window.scrollTo(0, 0);

            // FIX za Opening Animaciju: Zamrzavamo širinu svih OSTALIH slika
            // Ovo sprječava nasilno skaliranje kada flex width padne na 0
            document.querySelectorAll('.column').forEach(col => {
                if (col !== selectedColumn) {
                    col.querySelectorAll('.sticky-layer').forEach(layer => {
                        layer.style.width = col.offsetWidth + 'px'; // Zakucaj fizičku širinu
                    });
                    
                    col.classList.remove('active');
                    col.classList.add('hidden');
                }
            });

            selectedColumn.classList.remove('hidden');
            selectedColumn.classList.add('active');
            
            // FIX ZA SNAGGING PRI OTVARANJU PRVE KATEGORIJE
            // Zaledimo galeriju da spriječimo CPU intenzivno preračunavanje wrapovanja 30 slika dok traje tranzicija
            const gallery = selectedColumn.querySelector('.gallery');
            if (gallery) {
                gallery.style.width = document.documentElement.clientWidth + 'px';
                gallery.style.maxWidth = 'none';
            }

            document.body.classList.add('is-open');
            document.documentElement.classList.add('is-open');
            
            document.getElementById('closeBtn').classList.add('visible');

            // Uklonili smo inline setovanje transformacije ovde! 
            // Zato što je JS trajno lepio scale(1.10) na sliku i time rušio i hover i animaciju zatvaranja.
            // CSS klasa `.column.active .bg-image` se sama brine za to i automatski vraća u normalu kad ugasimo klasu.

            setTimeout(() => {
                if (gallery) gallery.classList.add('show');
            }, 800); 

            // Oslobađamo zakucanu širinu kad se flex tranzicija u potpunosti smiri (1.5s)
            setTimeout(() => {
                if (gallery) {
                    gallery.style.width = '';
                    gallery.style.maxWidth = '';
                }
            }, 1500);
        }

        function closeGallery(event) {
            event.stopPropagation();
            
            const activeCol = document.querySelector('.column.active');
            if (!activeCol) return;

            document.getElementById('closeBtn').classList.remove('visible');

            const gallery = activeCol.querySelector('.gallery');
            
            // 1. Zaledimo galeriju i zapocnemo njen fadeout ODMAH 
            if (gallery) {
                gallery.style.width = document.documentElement.clientWidth + 'px';
                gallery.style.maxWidth = 'none';
                
                // Usporen i meksi fade out galerije za glatkije stapanje (1s umesto 0.6s)
                gallery.style.transition = 'opacity 0.2s ease-out, transform 0.4s var(--ease-cinematic), visibility 1s';
                gallery.classList.remove('show');
            }

            // 2. ODMAH skidamo active klasu (OVO trigeruje sliku i blur da nestaju tacno kad pocne zatvaranje!)
            activeCol.classList.add('is-closing-active');
            document.querySelectorAll('.column').forEach(col => {
                col.classList.remove('active', 'hidden');
                
                // ODMRZAVAMO SIRINE SVIH OSTALIH SLIKA ODMAH kako bi mogle da se vrate na hover animacije
                col.querySelectorAll('.sticky-layer').forEach(layer => {
                    layer.style.width = '';
                });
            });

            // Odmrzavanje sirine same aktivne kolone
            activeCol.querySelectorAll('.sticky-layer').forEach(layer => {
                layer.style.width = '';
            });

            const startScroll = window.scrollY || document.documentElement.scrollTop;
            
            const scrollDuration = startScroll === 0 ? 600 : Math.min(1000, Math.max(600, startScroll * 0.3));
            const startTime = performance.now();

            function easeInOutQuart(t) {
                return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
            }

            function scrollAnim(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / scrollDuration, 1);
                
                const currentScrollY = startScroll * (1 - easeInOutQuart(progress));

                if (startScroll > 0) {
                    window.scrollTo(0, currentScrollY);
                }

                // JS STICKY FIX: Drzimo apsolutno SVE slike zakucane za vidokrug dok traje scroll,
                // uključujući i aktivnu sliku! (Jer CSS position:sticky otkazuje usled overflow:hidden)
                document.querySelectorAll('.column .sticky-layer').forEach(layer => {
                    layer.style.transform = `translate3d(0, ${currentScrollY}px, 0)`;
                });

                if (progress < 1) {
                    requestAnimationFrame(scrollAnim);
                } else {
                    document.body.classList.remove('is-open');
                    document.documentElement.classList.remove('is-open');
                    activeCol.classList.remove('is-closing-active');
                    
                    document.querySelectorAll('.sticky-layer').forEach(layer => {
                        layer.style.transform = '';
                    });

                    if (gallery) {
                        gallery.style.transition = '';
                        gallery.style.width = '';
                        gallery.style.maxWidth = '';
                    }
                }
            }
            
            requestAnimationFrame(scrollAnim);
        }

        // --- INFO WIDGET LOGIKA ---
        function toggleInfo(event) {
            event.stopPropagation();
            const popup = document.getElementById('infoPopup');
            popup.classList.toggle('show');
        }

        // Zatvaranje popup-a klikom bilo gde van njega
        document.addEventListener('click', (e) => {
            const popup = document.getElementById('infoPopup');
            const btn = document.getElementById('infoBtn');
            // Ako je popup otvoren, a kliknuli smo izvan njega i izvan dugmeta
            if (popup && popup.classList.contains('show') && !popup.contains(e.target) && !btn.contains(e.target)) {
                popup.classList.remove('show');
            }
        });
    </script>

</body>
